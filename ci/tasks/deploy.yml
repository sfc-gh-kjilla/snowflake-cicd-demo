platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.12-slim"

inputs:
  - name: repo

params:
  AUTH_MODE: oidc            # oidc | keypair
  SNOWFLAKE_ACCOUNT:
  SNOWFLAKE_TOKEN:           # OIDC: ((sfidtoken:token))
  SNOWFLAKE_USER:            # key-pair only
  SNOWFLAKE_PRIVATE_KEY_RAW: # key-pair only
  TARGET_DB:
  TARGET_SCHEMA: APP
  DEPLOY_ENV:

run:
  path: bash
  args: [repo/ci/tasks/deploy.sh]

# Snowflake CI/CD on Concourse: DEV -> QA -> PROD
#
#   fly -t local set-pipeline -p snowflake-cicd \
#     -c ci/pipeline.yml -l ci/vars.yml
#
# Gates: deploy-dev triggers on every commit to main. deploy-qa and deploy-prod
# only accept a commit that passed the previous job (`passed:`) and only run
# when a human triggers them (`trigger: false`). Restrict who can trigger with
# Concourse team roles; a separate team for prod is stronger still.

var_sources:
  # Concourse 7.14+ signs a short-lived JWT per step. With subject_scope: job
  # the sub claim is <team>/<pipeline>/<instance_vars>/<job>, e.g.
  # main/snowflake-cicd//deploy-prod, so each Snowflake service user only
  # trusts its own job.
  - name: sfidtoken
    type: idtoken
    config:
      audience: [((snowflake_oidc_audience))]
      subject_scope: job

resources:
  - name: repo
    type: git
    icon: git
    source:
      uri: ((git_uri))
      branch: main

# Two ways to deploy the same app, shown as tabs in the Concourse UI:
#   scripts - versioned SQL migrations via `snow sql`
#   dcm     - declarative DCM project via `snow dcm plan` / `deploy`
# They manage different schemas (APP vs APP_DCM), so they never overlap.
groups:
  - name: scripts
    jobs: [deploy-dev, deploy-qa, deploy-prod]
  - name: dcm
    jobs: [dcm-dev, dcm-plan-qa, dcm-deploy-qa, dcm-plan-prod, dcm-deploy-prod]
  - name: setup
    jobs: [print-token-claims]

jobs:
  - name: deploy-dev
    serial: true
    plan:
      - get: repo
        trigger: true
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params: &common
          AUTH_MODE: ((auth_mode))
          SNOWFLAKE_ACCOUNT: ((snowflake_account))
          SNOWFLAKE_TOKEN: ((sfidtoken:token))
          TARGET_SCHEMA: APP
          DEPLOY_ENV: dev
          TARGET_DB: CICD_DEMO_DEV
          SNOWFLAKE_USER: SVC_CICD_DEV_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_dev))

  - name: deploy-qa
    serial: true
    plan:
      - get: repo
        passed: [deploy-dev]
        trigger: false   # manual approval: click "+" / fly trigger-job
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params:
          <<: *common
          DEPLOY_ENV: qa
          TARGET_DB: CICD_DEMO_QA
          SNOWFLAKE_USER: SVC_CICD_QA_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_qa))

  - name: deploy-prod
    serial: true
    plan:
      - get: repo
        passed: [deploy-qa]
        trigger: false   # manual approval by a prod-team operator
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params:
          <<: *common
          DEPLOY_ENV: prod
          TARGET_DB: CICD_DEMO_PROD
          SNOWFLAKE_USER: SVC_CICD_PROD_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_prod))

  # ---- DCM path -------------------------------------------------------------
  # dcm-dev: plan + deploy automatically on every commit.
  # QA/PROD: a manual plan job (approver reads the planned CREATE/ALTER/DROP in
  # the build log), then a manual deploy job that only accepts a commit whose
  # plan job passed. Deploy re-plans internally against the live state.
  - name: dcm-dev
    serial: true
    plan:
      - get: repo
        trigger: true
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params: &dcm_common
          DCM_ACTION: deploy
          DCM_TARGET: DEV
          AUTH_MODE: ((auth_mode))
          SNOWFLAKE_ACCOUNT: ((snowflake_account))
          SNOWFLAKE_TOKEN: ((sfidtoken:token))
          DEPLOY_ENV: dev
          TARGET_DB: CICD_DEMO_DEV
          SNOWFLAKE_USER: SVC_CICD_DEV_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_dev))

  - name: dcm-plan-qa
    serial: true
    plan:
      - get: repo
        passed: [dcm-dev]
        trigger: false
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params: &dcm_qa
          <<: *dcm_common
          DCM_ACTION: plan
          DCM_TARGET: QA
          DEPLOY_ENV: qa
          TARGET_DB: CICD_DEMO_QA
          SNOWFLAKE_USER: SVC_CICD_QA_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_qa))

  - name: dcm-deploy-qa
    serial: true
    plan:
      - get: repo
        passed: [dcm-plan-qa]
        trigger: false   # approve after reviewing dcm-plan-qa output
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params:
          <<: *dcm_qa
          DCM_ACTION: deploy

  - name: dcm-plan-prod
    serial: true
    plan:
      - get: repo
        passed: [dcm-deploy-qa]
        trigger: false
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params: &dcm_prod
          <<: *dcm_common
          DCM_ACTION: plan
          DCM_TARGET: PROD
          DEPLOY_ENV: prod
          TARGET_DB: CICD_DEMO_PROD
          SNOWFLAKE_USER: SVC_CICD_PROD_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_prod))

  - name: dcm-deploy-prod
    serial: true
    plan:
      - get: repo
        passed: [dcm-plan-prod]
        trigger: false   # approve after reviewing dcm-plan-prod output
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params:
          <<: *dcm_prod
          DCM_ACTION: deploy
  # Setup helper: prints the decoded header and claims (not the signed token)
  # so you can copy iss/sub/aud into setup/02_oidc_service_user.sql. Its own
  # sub ends in /print-token-claims; deploy jobs end in /deploy-<env>.
  - name: print-token-claims
    plan:
      - task: decode
        params:
          TOKEN: ((sfidtoken:token))
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: python, tag: "3.12-slim" }
          params:
            TOKEN:
          run:
            path: python3
            args:
              - -c
              - |
                import base64, json, os
                def part(i):
                    s = os.environ["TOKEN"].split(".")[i]
                    return json.loads(base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)))
                print("header:", json.dumps(part(0), indent=2))
                print("claims:", json.dumps(part(1), indent=2))

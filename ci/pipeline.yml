# Snowflake CI/CD on Concourse: DEV -> release vX.Y.Z -> UAT -> PROD
#
#   fly -t local set-pipeline -p snowflake-cicd \
#     -c ci/pipeline.yml -l ci/vars.yml
#
# Flow (mirrors a release-based promotion model):
#   1. Commit to main          -> deploy-dev / dcm-dev run automatically
#   2. DEV passes              -> create-release tags vX.Y.Z, publishes a GitHub Release
#   3. New release             -> deploy-uat / dcm-deploy-uat run automatically
#   4. UAT sign-off            -> deploy-prod / dcm-deploy-prod triggered manually
#                                 with the same release (passed: ...-uat)
# Restrict who can trigger PROD with Concourse team roles; a separate team for
# prod is stronger still.

var_sources:
  # Concourse 7.14+ signs a short-lived JWT per step. With subject_scope: job
  # the sub claim is <team>/<pipeline>/<instance_vars>/<job>, e.g.
  # main/snowflake-cicd//deploy-prod, so each Snowflake service user only
  # trusts its own job.
  - name: sfidtoken
    type: idtoken
    config:
      audience: [((snowflake_oidc_audience))]
      subject_scope: job

resources:
  - name: repo
    type: git
    icon: git
    source:
      uri: ((git_uri))
      branch: main
      fetch_tags: true   # create-release reads the latest vX.Y.Z tag

  # Immutable release: git tag + GitHub Release, created by create-release.
  - name: release
    type: github-release
    icon: tag
    source:
      owner: ((github_owner))
      repository: ((github_repo))
      access_token: ((github_access_token))

# Two ways to deploy the same app, shown as tabs in the Concourse UI:
#   scripts - versioned SQL migrations via `snow sql`
#   dcm     - declarative DCM project via `snow dcm plan` / `deploy`
# They manage different schemas (APP vs APP_DCM), so they never overlap.
# create-release appears on both tabs: one release feeds both paths.
groups:
  - name: scripts
    jobs: [deploy-dev, create-release, deploy-uat, deploy-prod]
  - name: dcm
    jobs: [dcm-dev, create-release, dcm-deploy-uat, dcm-plan-prod, dcm-deploy-prod]
  - name: setup
    jobs: [print-token-claims]

jobs:
  # ---- DEV: every commit ----------------------------------------------------
  - name: deploy-dev
    serial: true
    plan:
      - get: repo
        trigger: true
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params: &common
          AUTH_MODE: ((auth_mode))
          SNOWFLAKE_ACCOUNT: ((snowflake_account))
          SNOWFLAKE_TOKEN: ((sfidtoken:token))
          TARGET_SCHEMA: APP
          DEPLOY_ENV: dev
          TARGET_DB: CICD_DEMO_DEV
          SNOWFLAKE_USER: SVC_CICD_DEV_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_dev))

  - name: dcm-dev
    serial: true
    plan:
      - get: repo
        trigger: true
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params: &dcm_common
          DCM_ACTION: deploy
          DCM_TARGET: DEV
          AUTH_MODE: ((auth_mode))
          SNOWFLAKE_ACCOUNT: ((snowflake_account))
          SNOWFLAKE_TOKEN: ((sfidtoken:token))
          DEPLOY_ENV: dev
          TARGET_DB: CICD_DEMO_DEV
          SNOWFLAKE_USER: SVC_CICD_DEV_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_dev))

  # ---- Release: tag the commit that passed DEV ------------------------------
  - name: create-release
    serial: true
    plan:
      - get: repo
        trigger: true
        passed: [deploy-dev, dcm-dev]
      - task: next-version
        file: repo/ci/tasks/create-release.yml
      - put: release
        params:
          name: release/name
          tag: release/tag
          body: release/body
          commitish: release/commitish

  # ---- UAT: automatic on a new release --------------------------------------
  - name: deploy-uat
    serial: true
    plan:
      - get: release
        trigger: true
        passed: [create-release]
      - get: repo
        passed: [create-release]
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params:
          <<: *common
          DEPLOY_ENV: uat
          TARGET_DB: CICD_DEMO_UAT
          SNOWFLAKE_USER: SVC_CICD_UAT_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_uat))

  - name: dcm-deploy-uat
    serial: true
    plan:
      - get: release
        trigger: true
        passed: [create-release]
      - get: repo
        passed: [create-release]
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params:
          <<: *dcm_common
          DCM_TARGET: UAT
          BLOCK_DROPS: "true"
          DEPLOY_ENV: uat
          TARGET_DB: CICD_DEMO_UAT
          SNOWFLAKE_USER: SVC_CICD_UAT_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_uat))

  # ---- PROD: manual, same release that passed UAT ---------------------------
  - name: deploy-prod
    serial: true
    plan:
      - get: release
        passed: [deploy-uat]
        trigger: false   # manual after UAT / business sign-off
      - get: repo
        passed: [deploy-uat]
      - task: deploy
        file: repo/ci/tasks/deploy.yml
        params:
          <<: *common
          DEPLOY_ENV: prod
          TARGET_DB: CICD_DEMO_PROD
          SNOWFLAKE_USER: SVC_CICD_PROD_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_prod))

  # DCM PROD: a manual plan job (approver reads the planned CREATE/ALTER/DROP
  # in the build log), then a manual deploy that only accepts a release whose
  # plan passed. Deploy re-plans internally against the live state.
  - name: dcm-plan-prod
    serial: true
    plan:
      - get: release
        passed: [dcm-deploy-uat]
        trigger: false
      - get: repo
        passed: [dcm-deploy-uat]
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params: &dcm_prod
          <<: *dcm_common
          DCM_ACTION: plan
          DCM_TARGET: PROD
          BLOCK_DROPS: "true"
          DEPLOY_ENV: prod
          TARGET_DB: CICD_DEMO_PROD
          SNOWFLAKE_USER: SVC_CICD_PROD_KP
          SNOWFLAKE_PRIVATE_KEY_RAW: ((snowflake_private_key_prod))

  - name: dcm-deploy-prod
    serial: true
    plan:
      - get: release
        passed: [dcm-plan-prod]
        trigger: false   # approve after reviewing dcm-plan-prod output
      - get: repo
        passed: [dcm-plan-prod]
      - task: dcm
        file: repo/ci/tasks/dcm.yml
        params:
          <<: *dcm_prod
          DCM_ACTION: deploy

  # Setup helper: prints the decoded header and claims (not the signed token)
  # so you can copy iss/sub/aud into setup/02_oidc_service_user.sql. Its own
  # sub ends in /print-token-claims; deploy jobs end in /deploy-<env>.
  - name: print-token-claims
    plan:
      - task: decode
        params:
          TOKEN: ((sfidtoken:token))
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: python, tag: "3.12-slim" }
          params:
            TOKEN:
          run:
            path: python3
            args:
              - -c
              - |
                import base64, json, os
                def part(i):
                    s = os.environ["TOKEN"].split(".")[i]
                    return json.loads(base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)))
                print("header:", json.dumps(part(0), indent=2))
                print("claims:", json.dumps(part(1), indent=2))

# Local Concourse for the demo (idtoken requires 7.14+; pinned to 8.3.2).
#
#   docker compose -f ci/docker-compose.yml up -d
#   open http://localhost:8080   (user: demo / password: demo)
#
# OIDC needs a public issuer: Snowflake must fetch
#   <issuer>/.well-known/openid-configuration and its jwks_uri.
# For the live demo, expose port 8080 through a tunnel and set
# CONCOURSE_EXTERNAL_URL to the tunnel URL before `up` (see README), e.g.
#   CONCOURSE_EXTERNAL_URL=https://<random>.trycloudflare.com docker compose ... up -d
services:
  concourse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: concourse
      POSTGRES_USER: concourse_user
      POSTGRES_PASSWORD: concourse_pass
      PGDATA: /database

  concourse:
    image: concourse/concourse:8.3.2
    command: quickstart
    privileged: true
    depends_on: [concourse-db]
    ports: ["8080:8080"]
    environment:
      CONCOURSE_POSTGRES_HOST: concourse-db
      CONCOURSE_POSTGRES_USER: concourse_user
      CONCOURSE_POSTGRES_PASSWORD: concourse_pass
      CONCOURSE_POSTGRES_DATABASE: concourse
      CONCOURSE_EXTERNAL_URL: ${CONCOURSE_EXTERNAL_URL:-http://localhost:8080}
      CONCOURSE_ADD_LOCAL_USER: demo:demo
      CONCOURSE_MAIN_TEAM_LOCAL_USER: demo
      CONCOURSE_WORKER_RUNTIME: containerd
      CONCOURSE_WORKER_CONTAINERD_DNS_SERVER: "8.8.8.8"
      CONCOURSE_WORKER_BAGGAGECLAIM_DRIVER: overlay
      CONCOURSE_CLUSTER_NAME: snowflake-cicd-demo

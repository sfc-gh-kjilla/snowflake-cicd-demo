manifest_version: 2
type: DCM_PROJECT
default_target: 'DEV'

# One target per environment. At the customer each target is its own Snowflake
# account (different account_identifier); in this demo all three point at the
# same account, so each target has its own database and project object.
targets:
  DEV:
    account_identifier: SFSENORTHAMERICA-KJILLA
    project_name: 'CICD_DEMO_DEV.DCM.DEMO_PROJECT'
    project_owner: CICD_DEPLOY_DEV
    templating_config: 'DEV'
  UAT:
    account_identifier: SFSENORTHAMERICA-KJILLA
    project_name: 'CICD_DEMO_UAT.DCM.DEMO_PROJECT'
    project_owner: CICD_DEPLOY_UAT
    templating_config: 'UAT'
  PROD:
    account_identifier: SFSENORTHAMERICA-KJILLA
    project_name: 'CICD_DEMO_PROD.DCM.DEMO_PROJECT'
    project_owner: CICD_DEPLOY_PROD
    templating_config: 'PROD'

templating:
  defaults:
    db: 'CICD_DEMO_DEV'
    retention_days: 1
    # Empty for shared environments. A developer sandbox overrides it at run
    # time (scripts/dev-sandbox.sh -> --variable "suffix='_KIRAN'") so its
    # objects get distinct names and never collide with DEV.
    suffix: ''
  configurations:
    DEV:
      db: 'CICD_DEMO_DEV'
      retention_days: 1
    UAT:
      db: 'CICD_DEMO_UAT'
      retention_days: 1
    PROD:
      db: 'CICD_DEMO_PROD'
      retention_days: 7

name: Promote DEV -> UAT -> PROD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Never run two promotions at once; queue the newer one.
concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev

  uat:
    needs: dev
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: uat   # protection rule: required reviewer

  prod:
    needs: uat
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod # protection rule: required reviewers, main branch only
